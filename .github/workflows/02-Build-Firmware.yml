name: 02-Build-Firmware

on:
  pull_request:
    branches:
      - main
      - master
      - "release/**"
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branches to run the workflow on'
        required: true
        default: 'main'

jobs:
  FW_build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch }}

      - name: Build Docker Image
        run: docker build -t ${{ github.event.repository.name }}-build-env:latest .

      - name: Run Docker Container
        run: |
          for i in {1..3}; do
            echo "Building with PRJ_MACROS=-D_HW_CNF_HW_VERSION=$i"
            docker run --rm \
              -v ${{ github.workspace }}:/${{ github.event.repository.name }}/ \
              -w /${{ github.event.repository.name }}/ \
              ${{ github.event.repository.name }}-build-env:latest \
              /bin/bash -c "make all TYPE=debug PRJ_MACROS=-D_HW_CNF_HW_VERSION=$i && make all TYPE=release PRJ_MACROS=-D_HW_CNF_HW_VERSION=$i"
          done

      - name: Clean up Docker & workspace
        if: always()
        run: |
          echo "Cleaning Git workspace"
          docker run -u root --rm \
          -v ${{ github.workspace }}:/${{ github.event.repository.name }}/ \
          -w /${{ github.event.repository.name }}/ \
          ${{ github.event.repository.name }}-build-env:latest /bin/bash -c " \
          git config --global --add safe.directory /${{ github.event.repository.name }} \
          && git clean -ffdx "
          echo "Cleanup complete"
